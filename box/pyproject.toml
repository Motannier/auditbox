[project]
name = "box"
version = "0.1.0"
description = "AuditBox relay core for audited SSH/Telnet terminal proxying"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "paramiko>=3.0.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "pyserial>=3.5",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
auditbox-proxy = "auditbox.app.proxy_server:main"
auditbox-gateway = "auditbox.gateway.server:main"
auditbox-inference = "auditbox.inference.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditbox"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
