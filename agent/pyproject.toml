[project]
name = "auditbox-agent"
version = "0.1.0"
description = "Local Agno-based harness agent service for AuditBox"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
  "agno[mcp,text]>=2.8,<3",
  "docker>=7.1,<8",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.100,<3",
  "ollama>=0.6,<1",
  "pydantic-settings>=2.10,<3",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.40,<3",
  "reportlab>=4.4,<5",
  "tiktoken>=0.12,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
knowledge = [
  "agno[markdown,pdf,text]>=2.8,<3",
  "chromadb>=1.0,<2",
]
office = [
  "agno[docx,excel,markdown,pdf,pptx,text]>=2.8,<3",
  "chromadb>=1.0,<2",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
auditbox-agent = "auditbox_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditbox_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false
